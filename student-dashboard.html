<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard - Social & Green Club</title>

    <link rel="stylesheet" href="student-dashboard.css">
</head>

<body>

    <header>
        <h1>Social & Green Club</h1>

        <button onclick="logout()">
            Logout
        </button>
    </header>


    <main>

        <section>
            <h2>My Profile</h2>

            <div id="profile">
                Loading profile...
            </div>
        </section>


        <section>
            <h2>My Attendance</h2>

            <div id="attendance-summary">
                Loading attendance...
            </div>

            <div id="attendance-history">
            </div>
        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://fsbjmbsaelziokfxuceu.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_2R1qWvsM0ZV58svpkX1O-g_vDFBu9oq";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function loadStudentDashboard() {

            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();


            if (userError || !user) {

                window.location.href = "login.html";
                return;

            }


            // Get student ID from profile
            const { data: profile, error: profileError } =
                await supabaseClient
                    .from("profiles")
                    .select("student_id")
                    .eq("id", user.id)
                    .single();


            if (profileError || !profile) {

                document.getElementById("profile").innerHTML =
                    "<p>Student profile not found.</p>";

                return;

            }


            const studentId = profile.student_id;


            // Get student information
            const { data: student, error: studentError } =
                await supabaseClient
                    .from("students")
                    .select("*")
                    .eq("id", studentId)
                    .single();


            if (studentError || !student) {

                document.getElementById("profile").innerHTML =
                    "<p>Student record not found.</p>";

                return;

            }


            document.getElementById("profile").innerHTML = `

                <p><strong>Name:</strong> ${student.name || "-"}</p>

                <p><strong>Roll No:</strong> ${student.roll_no || "-"}</p>

                <p><strong>Department:</strong> ${student.department || "-"}</p>

                <p><strong>Course:</strong> ${student.course || "-"}</p>

                <p><strong>Year:</strong> ${student.year || "-"}</p>

                <p><strong>Section:</strong> ${student.section || "-"}</p>

                <p><strong>Mobile:</strong> ${student.mobile || "-"}</p>

            `;


            // Get attendance
            const { data: attendance, error: attendanceError } =
                await supabaseClient
                    .from("attendance")
                    .select("*")
                    .eq("student_id", studentId)
                    .order("attendance_date", {
                        ascending: false
                    });


            if (attendanceError) {

                document.getElementById("attendance-summary").innerHTML =
                    "<p>Unable to load attendance.</p>";

                console.error(attendanceError);

                return;

            }


            let present = 0;
            let absent = 0;


            attendance.forEach(record => {

                if (record.status === "present") {
                    present++;
                }

                if (record.status === "absent") {
                    absent++;
                }

            });


            const total = present + absent;

            const percentage =
                total > 0
                    ? ((present / total) * 100).toFixed(1)
                    : 0;


            document.getElementById("attendance-summary").innerHTML = `

                <p><strong>Present:</strong> ${present}</p>

                <p><strong>Absent:</strong> ${absent}</p>

                <p><strong>Total:</strong> ${total}</p>

                <p><strong>Attendance:</strong> ${percentage}%</p>

            `;


            const history =
                document.getElementById("attendance-history");


            if (attendance.length === 0) {

                history.innerHTML =
                    "<p>No attendance records found.</p>";

                return;

            }


            history.innerHTML = `

                <h3>Attendance History</h3>

                ${attendance.map(record => `

                    <div>

                        <strong>
                            ${record.attendance_date}
                        </strong>

                        -
                        ${record.status}

                    </div>

                `).join("")}

            `;

        }


        async function logout() {

            await supabaseClient.auth.signOut();

            window.location.href = "login.html";

        }


        loadStudentDashboard();
    

    </script>

</body>
</html>
