<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Social & Green Club - Admin Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="logo-section">

            <div class="club-logo">
                🎓
            </div>

            <h1>Social & Green Club</h1>

            <p>Attendance Management System</p>

        </div>


        <div class="login-box">

            <h2>Admin Login</h2>

            <p class="choose-text">
                Login to manage students & attendance
            </p>


            <form onsubmit="adminLogin(event)">

                <div class="input-group">

                    <label>Admin Email</label>

                    <input
                        type="email"
                        id="admin-email"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="admin-password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Login as Admin
                </button>

            </form>

        </div>


        <div class="footer">

            <p>
                © 2026 Social & Green Club
            </p>

        </div>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Login JS -->

    <script src="login.js"></script>

</body>

</html>
